# config/queries.yaml
# Central configuration for all semantic search queries, thresholds, and settings
# Author: Marleen de Jonge
# Date: 2025

# =============================================================================
# MODEL CONFIGURATIONS
# =============================================================================
models:
  sentence_transformer: "sentence-transformers/all-mpnet-base-v2"
  climate_classifier: "climatebert/distilroberta-base-climate-detector"

# =============================================================================
# DEFAULT SIMILARITY THRESHOLDS
# =============================================================================
default_thresholds:
  high_precision: 0.50    # Conservative threshold for high-confidence matches
  balanced: 0.45          # Balanced precision/recall (recommended)
  high_recall: 0.40       # More inclusive threshold
  experimental: 0.35      # For exploratory analysis

# =============================================================================
# CLIMATE POLICY ANALYSIS QUERIES
# =============================================================================
policies:
  paris_agreement:
    queries:
      - "Paris Agreement COP21 international climate accord global warming 1.5 degrees"
      - "Paris climate agreement commitments nationally determined contributions NDCs"
      - "COP21 Paris accord climate targets emission reduction pledges"
      - "international climate agreement Paris framework temperature goals"
      - "global climate deal Paris implementation compliance"
      - "Paris Agreement withdrawal re-entry climate commitments"
      - "climate accord Paris international cooperation climate finance"
      - "Paris Agreement Article 6 carbon markets international cooperation"
    threshold: 0.45
    description: "Paris Agreement and COP21 related climate policy discussions"
    
  eu_green_deal:
    queries:
      - "European Green Deal EU climate law fit for 55 package"
      - "Green Deal European climate policy EU taxonomy regulation"
      - "EU Green Deal climate neutrality 2050 European climate law"
      - "European Green Deal sustainable finance disclosure regulation SFDR"
      - "Green Deal investment plan Europe climate transition fund"
      - "EU taxonomy green investment sustainable finance classification"
      - "European climate law climate target plan 2030 emissions reduction"
      - "Fit for 55 package carbon border adjustment CBAM"
    threshold: 0.45
    description: "EU Green Deal and related European climate policies"
    
  us_ira:
    queries:
      - "Inflation Reduction Act IRA climate provisions clean energy tax credits"
      - "IRA Inflation Reduction Act renewable energy incentives climate investments"
      - "US climate legislation Inflation Reduction Act clean energy subsidies"
      - "Biden climate bill IRA tax credits clean energy manufacturing"
      - "Inflation Reduction Act clean technology domestic production incentives"
      - "IRA climate investment American manufacturing green energy jobs"
      - "US domestic climate policy IRA clean energy transition"
      - "Inflation Reduction Act electric vehicle tax credits clean energy"
    threshold: 0.40
    description: "US Inflation Reduction Act climate provisions and incentives"
    
  cop_meetings:
    queries:
      - "COP climate conference international negotiations UNFCCC"
      - "Conference of Parties climate summit global negotiations"
      - "COP26 Glasgow climate conference net zero commitments"
      - "COP27 Egypt climate summit loss and damage fund"
      - "COP28 Dubai climate conference fossil fuel transition"
      - "international climate negotiations COP global climate action"
      - "climate summit COP presidency international climate diplomacy"
      - "UNFCCC COP climate conference global climate governance"
    threshold: 0.45
    description: "UN Climate Conferences (COP meetings) and international negotiations"

  carbon_pricing:
    queries:
      - "carbon pricing carbon tax carbon credits emissions trading"
      - "cap and trade carbon market carbon pricing mechanisms"
      - "EU ETS European emissions trading system carbon permits"
      - "carbon fee carbon levy carbon pricing policies regulations"
      - "internal carbon price shadow price carbon pricing strategy"
      - "carbon border adjustment CBAM carbon leakage protection"
      - "regional carbon markets linking international carbon pricing"
      - "carbon tax policy design carbon pricing implementation"
    threshold: 0.40
    description: "Carbon pricing mechanisms and policies"

  climate_disclosure:
    queries:
      - "climate risk disclosure ESG reporting TCFD recommendations"
      - "TCFD climate scenario analysis physical transition risks"
      - "sustainability reporting framework climate disclosure requirements"
      - "carbon footprint disclosure scope 1 2 3 emissions"
      - "climate governance reporting climate risk management"
      - "ESG disclosure climate targets net zero commitments"
      - "climate-related financial disclosures TCFD implementation"
      - "mandatory climate disclosure regulations SEC climate rules"
    threshold: 0.40
    description: "Climate disclosure requirements and frameworks"

# =============================================================================
# CLIMATE RISK ANALYSIS QUERIES
# =============================================================================
risk_analysis:
