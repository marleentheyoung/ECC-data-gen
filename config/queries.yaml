        - "sustainable products market transition brand reputation climate preferences"
        - "market demand sustainable products green consumer preferences"
        - "climate-conscious consumers market transition reputation risk"
        - "sustainable market trends consumer behavior climate awareness"
        - "green products market demand climate consumer preferences"
      threshold: 0.40
