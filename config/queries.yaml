    technology:
      queries:
        - "clean technology renewable energy transition technological disruption"
        - "energy transition technology obsolescence stranded assets technological risk"
        - "low-carbon technology renewable energy competitive disadvantage technology transition"
        - "clean tech innovation energy transformation technological transition risk"
        - "technological disruption clean energy competitiveness"
        - "energy technology transition renewable energy adoption"
        - "clean technology development technological obsolescence"
        - "technology transition risks clean energy innovation"
