# =============================================================================
# ANALYSIS SETTINGS
# =============================================================================
analysis_settings:
  time_series:
    smoothing_window: 3           # months for moving average
    min_data_points: 5            # minimum observations for reliable trends
    default_frequency: "quarter"  # quarterly, monthly, yearly, daily
    
  aggregation:
    min_snippets_per_period: 1    # minimum snippets to include period
    aggregation_method: "sum"     # sum, mean, max for mention counts
    
  search_parameters:
    default_top_k: 2000          # maximum results per query
    max_queries_per_topic: 8     # maximum queries to prevent overloading
    
  export:
    include_metadata: true
    date_format: "%Y-%m-%d"
    decimal_places: 4
    export_formats: ["csv", "json"]

# =============================================================================
# OUTPUT PATHS
# =============================================================================
output_paths:
  results: "outputs/analysis_results"
  visualizations: "outputs/visualizations"  
  exports: "outputs/exports"
  reports: "outputs/reports"
  logs: "logs"

# =============================================================================
# INDEX SETTINGS
# =============================================================================
index_settings:
  default_index_path: "data/semantic_indexes/combined"
  model_compatibility_check: true
  validation_on_load: true

# =============================================================================
# VALIDATION SETTINGS
# =============================================================================
validation:
  min_similarity_score: 0.30     # absolute minimum threshold
  max_similarity_score: 1.00     # maximum possible threshold
  required_query_fields: ["queries", "threshold", "description"]
  
# =============================================================================
# EXPERIMENTAL FEATURES
# =============================================================================
experimental:
  adaptive_thresholds: false      # automatically adjust thresholds based on results
  cross_policy_analysis: true     # enable cross-policy comparative analysis
  sentiment_analysis: false       # analyze sentiment of climate discussions
  temporal_attention_decay: false # weight recent mentions more heavily