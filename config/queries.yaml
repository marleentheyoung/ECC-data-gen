        - "extreme weather climate physical risk operational disruption supply chain"
        - "hurricanes floods droughts wildfires extreme weather events business operations"
        - "climate-related natural disasters physical infrastructure damage"
        - "severe weather operational resilience climate adaptation physical assets"
        - "acute physical risks climate hazards business continuity"
        - "extreme weather supply chain disruption operational impacts"
        - "natural disasters climate change physical infrastructure"
        - "weather-related operational risks climate physical impacts"
      threshold: 0.40
      description: "Acute physical climate risks from extreme weather events"
      
    chronic_risks:
      queries:
        - "rising sea levels temperature changes precipitation patterns long-term climate"
        - "chronic physical risks climate change operational locations infrastructure"
        - "long-term climate trends physical environment changing weather patterns"
